name: Phyto Doctor Production Release & Verification CI/CD

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------------------
  # 1. Backend Verification & Security Audit
  # ----------------------------------------------------------------------------
  backend-test:
    name: Backend Pytest Suite & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Backend Test Suite
        env:
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key_ci_environment_verification_hs256_32bytes
          DATABASE_URL: sqlite+aiosqlite:///./test_phytodoctor.db
        run: |
          pytest -v

      - name: Test Database Disaster Recovery Drill
        run: |
          python scripts/backup_restore.py --drill

  # ----------------------------------------------------------------------------
  # 2. React / Vite Admin Dashboard Build
  # ----------------------------------------------------------------------------
  admin-build:
    name: Admin Dashboard Production Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: admin/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Dashboard Dist
        env:
          VITE_API_URL: https://phytodoctor-api.onrender.com/api/v1
        run: npm run build

      - name: Upload Dashboard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dashboard-dist
          path: admin/dist/
          retention-days: 14

  # ----------------------------------------------------------------------------
  # 3. Flutter Android Release Build (APK & AAB)
  # ----------------------------------------------------------------------------
  mobile-android-build:
    name: Flutter Android Build (APK & AAB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Flutter Unit & Widget Tests
        run: flutter test

      - name: Configure Android Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystores
            echo "$KEYSTORE_BASE64" | base64 --decode > keystores/phytodoctor-release.jks
            echo "$KEY_PROPERTIES" > android/key.properties
            echo "[OK] Injected release keystore and key.properties."
          else
            echo "[!] No release keystore secret configured; building unsigned/debug signed bundle for testing."
          fi

      - name: Build Release APK (Field Testing)
        run: |
          flutter build apk --release --dart-define=API_URL=https://phytodoctor-api.onrender.com

      - name: Build Release App Bundle (Google Play Release)
        run: |
          flutter build appbundle --release --dart-define=API_URL=https://phytodoctor-api.onrender.com

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phytodoctor-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phytodoctor-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
