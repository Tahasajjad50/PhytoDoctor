name: Render Free Tier Keep-Alive Pinger

on:
  # Schedule disabled during development to preserve Render free hours and resources
  # schedule:
  #   - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger only when needed

jobs:
  ping:
    name: Ping Render Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive HTTP GET
        run: |
          echo "Pinging PhytoDoctor Render API at $(date)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://phytodoctor-api.onrender.com/api/v1/health || true)
          echo "Response code: $STATUS"

